name: Slack Notify

on:
  pull_request:
    types: [opened, reopened]
  issue_comment:
    types: [created]
  pull_request_review_comment:
    types: [created]
  pull_request_review:
    types: [submitted]

jobs:
  notify-pr-opened:
    if: >
      github.event_name == 'pull_request' &&
      (github.event.action == 'opened' || github.event.action == 'reopened')
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Notify Slack about new PR
        uses: slackapi/slack-github-action@v2.1.0
        with:
          webhook: ${{ secrets.SLACK_WEBHOOK_URL_PR_OPENED }}
          webhook-type: incoming-webhook
          payload: |
            {
              "text": "📝 新しいPRが作成されました",
              "blocks": [
                {
                  "type": "header",
                  "text": {
                    "type": "plain_text",
                    "text": "📝 新しいPRが作成されました"
                  }
                },
                {
                  "type": "section",
                  "fields": [
                    {
                      "type": "mrkdwn",
                      "text": "*タイトル:*\n<${{ github.event.pull_request.html_url }}|${{ github.event.pull_request.title }}>"
                    },
                    {
                      "type": "mrkdwn",
                      "text": "*作成者:*\n${{ github.event.pull_request.user.login }}"
                    }
                  ]
                },
                {
                  "type": "section",
                  "text": {
                    "type": "mrkdwn",
                    "text": "*ブランチ:* `${{ github.event.pull_request.head.ref }}` → `${{ github.event.pull_request.base.ref }}`"
                  }
                }
              ]
            }

  notify-pr-comment:
    if: >
      (github.event_name == 'issue_comment' && github.event.issue.pull_request) ||
      github.event_name == 'pull_request_review_comment' ||
      (github.event_name == 'pull_request_review' && github.event.review.body != '')
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Notify Slack about PR comment
        uses: slackapi/slack-github-action@v2.1.0
        with:
          webhook: ${{ secrets.SLACK_WEBHOOK_URL_PR_COMMENT }}
          webhook-type: incoming-webhook
          payload: |
            {
              "text": "💬 PRにコメントがつきました",
              "blocks": [
                {
                  "type": "header",
                  "text": {
                    "type": "plain_text",
                    "text": "💬 PRにコメントがつきました"
                  }
                },
                {
                  "type": "section",
                  "fields": [
                    {
                      "type": "mrkdwn",
                      "text": "*PR:*\n<${{ github.event.issue.pull_request.html_url || github.event.pull_request.html_url }}|#${{ github.event.issue.number || github.event.pull_request.number }}>"
                    },
                    {
                      "type": "mrkdwn",
                      "text": "*コメント者:*\n${{ github.event.comment.user.login || github.event.review.user.login }}"
                    }
                  ]
                },
                {
                  "type": "section",
                  "text": {
                    "type": "mrkdwn",
                    "text": ${{ toJSON(github.event.comment.body || github.event.review.body) }}
                  }
                }
              ]
            }
